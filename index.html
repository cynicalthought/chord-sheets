<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Library</title>
    <link rel="stylesheet" href="style.css">
    <script>
        (function () {
            var theme = 'handwritten_parchment';
            var ok = /^[a-z0-9_-]+$/i;
            try {
                var q = new URLSearchParams(location.search).get('theme');
                if (q && ok.test(q)) {
                    theme = q;
                    localStorage.setItem('songTheme', q);
                } else {
                    var saved = localStorage.getItem('songTheme');
                    if (saved && ok.test(saved)) theme = saved;
                }
            } catch (e) {}
            if (theme !== 'plain') {
                document.write('<script src="Themes/' + theme + '.js"><\/script>');
            }
            window.ACTIVE_THEME = theme;
        })();
    </script>
</head>
